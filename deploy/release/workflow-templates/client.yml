name: PokerAttack Client CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a validated candidate or restore an accepted artifact
        type: choice
        options: [release, restore]
        default: release
      restore_run:
        description: Original accepted run ID (restore only)
        type: string
      restore_attempt:
        description: Original accepted run attempt (restore only)
        type: string
      restore_artifact:
        description: Original accepted numeric artifact ID (restore only)
        type: string
      restore_checksum:
        description: Accepted archive SHA256 (restore only)
        type: string

permissions:
  contents: read

concurrency:
  group: pokerattack-production-release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      client: ${{ steps.detect.outputs.client }}
      production_eligible: ${{ steps.detect.outputs.production_eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        run: python3 deploy/release/changes.py

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate production preparation and release boundaries
        run: |
          node --test deploy/prepare-production-client.test.mjs deploy/prepare-client-artifact.test.mjs
          node --test tests/release/*.test.cjs
          python -m pip install -r deploy/release/requirements-validation.txt
          python -m unittest discover -s deploy/release -p 'test_*.py' -v
          npm ci --prefix tests
          npm --prefix tests run test:guards

  package:
    needs: [changes, checks]
    if: needs.changes.outputs.client == 'true' && inputs.operation != 'restore'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_artifact_id: ${{ steps.manifest-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Record tools and install WASM workload
        run: |
          dotnet --info
          node --version
          python --version
          dotnet workload install wasm-tools --skip-manifest-update
          dotnet workload list
          python -m pip install -r deploy/release/requirements-validation.txt
      - name: Publish and prepare once
        run: |
          dotnet publish src/Client/ChefKnifeStudios.PokerAttack.Client.WebApp -c Release -o artifacts/client-publish /p:BlazorEnableCompression=false
          node deploy/prepare-production-client.mjs artifacts/client-publish/wwwroot artifacts/client-production
          python deploy/release/client_artifacts.py pack artifacts/client-production artifacts/client.tar.gz artifacts/client-candidate.json "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: client-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/client.tar.gz
            artifacts/client-candidate.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Bind the actual Actions artifact ID and verify exact archive
        env:
          CLIENT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python deploy/release/client_artifacts.py finalize artifacts/client-candidate.json "$CLIENT_ARTIFACT_ID" artifacts/client-manifest.json
          python deploy/release/client_artifacts.py check artifacts/client.tar.gz artifacts/client-manifest.json
          python deploy/release/client_artifacts.py summary artifacts/client-manifest.json artifacts/client-identity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: manifest-upload
        with:
          name: client-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/client-manifest.json
            artifacts/client-identity.json
          if-no-files-found: error
          retention-days: 30

  validation:
    name: Client validation
    needs: [changes, checks, package]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report stable required check
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.checks.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          CLIENT_CHANGED: ${{ needs.changes.outputs.client }}
          RESTORE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'restore' }}
        run: |
          test "$CHANGE_RESULT" = success
          test "$CHECK_RESULT" = success
          if [ "$CLIENT_CHANGED" = true ] && [ "$RESTORE" != true ]; then
            test "$PACKAGE_RESULT" = success
          fi

  deploy:
    needs: [changes, package, validation]
    if: >-
      always() && needs.validation.result == 'success' &&
      github.repository == 'henryfaulkner/ChefKnifeStudios.PokerAttack' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.production_eligible == 'true' &&
      needs.changes.outputs.client == 'true' &&
      vars.DEPLOYMENT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: client-swa
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOYMENT_AUTOMATION_ENABLED: ${{ vars.DEPLOYMENT_AUTOMATION_ENABLED }}
      CLIENT_ARCHIVE_ACCOUNT: ${{ vars.CLIENT_ARCHIVE_ACCOUNT }}
      CLIENT_OPERATION: ${{ inputs.operation || 'release' }}
      RESTORE_RUN: ${{ inputs.restore_run }}
      RESTORE_ATTEMPT: ${{ inputs.restore_attempt }}
      RESTORE_ARTIFACT: ${{ inputs.restore_artifact }}
      RESTORE_CHECKSUM: ${{ inputs.restore_checksum }}
    steps:
      - name: Require implemented operation and exact artifact IDs
        env:
          OPERATION: ${{ inputs.operation || 'release' }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          MANIFEST_ARTIFACT_ID: ${{ needs.package.outputs.manifest_artifact_id }}
        run: |
          if [ "$OPERATION" = release ]; then
            [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$MANIFEST_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          elif [ "$OPERATION" = restore ]; then
            [[ "$RESTORE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$RESTORE_ATTEMPT" =~ ^[1-9][0-9]{0,4}$ ]]
            [[ "$RESTORE_ARTIFACT" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$RESTORE_CHECKSUM" =~ ^[a-f0-9]{64}$ ]]
          else
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install protected verification runtime
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install -r ../deploy/release/requirements-validation.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.operation != 'restore'
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: artifacts/client-release-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.operation != 'restore'
        with:
          artifact-ids: ${{ needs.package.outputs.manifest_artifact_id }}
          path: artifacts/client-release-input
          merge-multiple: true
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reserve client slot and restore validated exact artifact
        id: prepare
        env:
          CLIENT_CANDIDATE_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_CLIENT_LEASE_PRIVATE_KEY: ${{ secrets.LINODE_CLIENT_LEASE_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/client_publish.py prepare
      - name: Recheck eligibility immediately before upload
        if: steps.prepare.outputs.upload_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/client_publish.py recheck
      - name: Deploy exact prepared client
        id: publish
        if: steps.prepare.outputs.upload_needed == 'true'
        timeout-minutes: 15
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # maintained v1 branch
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          production_branch: main
          app_location: artifacts/client-release/client
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
      - name: Verify all origins and fresh browser connections
        id: verify
        continue-on-error: true
        env:
          POKERATTACK_RELEASE_MODE: production
          POKERATTACK_CLIENT_MANIFEST: artifacts/client-release/manifest.json
          POKERATTACK_CLIENT_RESULT: artifacts/client-verification.json
        run: node tests/release/client.cjs
      - name: Commit accepted archive and finish only the client slot
        id: commit
        if: steps.verify.outcome == 'success'
        env:
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_CLIENT_LEASE_PRIVATE_KEY: ${{ secrets.LINODE_CLIENT_LEASE_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/client_publish.py commit
      - name: Resolve failed publication before any restoration
        id: recovery
        if: steps.verify.outcome == 'failure'
        env:
          PUBLICATION_OUTCOME: ${{ steps.publish.outcome }}
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/client_publish.py prepare-restoration
      - name: Restore only the recorded accepted predecessor
        id: restore
        if: steps.recovery.outputs.restore_upload_needed == 'true'
        timeout-minutes: 15
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # maintained v1 branch
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          production_branch: main
          app_location: artifacts/client-release/recovery-client
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
      - name: Verify restored bytes and normal browser connection
        id: verify-restored
        if: steps.recovery.outcome == 'success'
        env:
          POKERATTACK_RELEASE_MODE: production
          POKERATTACK_CLIENT_MANIFEST: artifacts/client-release/recovery-manifest.json
          POKERATTACK_CLIENT_RESULT: artifacts/client-restoration-verification.json
        run: node tests/release/client.cjs
      - name: Finish client restoration without claiming attempted release success
        id: finish-restored
        if: steps.verify-restored.outcome == 'success'
        env:
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_CLIENT_LEASE_PRIVATE_KEY: ${{ secrets.LINODE_CLIENT_LEASE_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/client_publish.py commit --restored --result artifacts/client-restoration-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.commit.outcome == 'success' || steps.finish-restored.outcome == 'success'
        with:
          name: client-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/client-verification.json
            artifacts/client-restoration-verification.json
            artifacts/client-release/completion.json
          if-no-files-found: error
          retention-days: 30
      - name: Record truthful overall result
        if: always()
        env:
          VERIFIED: ${{ steps.verify.outcome }}
          COMMITTED: ${{ steps.commit.outcome }}
          RESTORED: ${{ steps.finish-restored.outcome }}
        run: |
          if [ "$VERIFIED" = success ] && [ "$COMMITTED" = success ]; then
            echo 'Client accepted and client slot released.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Client attempt failed. Verified restoration result: $RESTORED. Inspect the host client lease before further mutation." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
