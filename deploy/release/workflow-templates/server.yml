name: PokerAttack Server CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deliver a tested release or the host-recorded recovery pair
        type: choice
        options: [release, rollback]
        default: release
        required: true

env:
  SERVER_OPERATION: ${{ inputs.operation || 'release' }}

permissions:
  contents: read

concurrency:
  group: pokerattack-production-release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.detect.outputs.server }}
      production_eligible: ${{ steps.detect.outputs.production_eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        run: python3 deploy/release/changes.py

  isolated:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image_artifact_id: ${{ steps.image-upload.outputs.artifact-id }}
    env:
      POKERATTACK_FIXTURE_IMAGE: pokerattack-api:ci-${{ github.sha }}
      POKERATTACK_FIXTURE_MIGRATION_IMAGE: pokerattack-migrations:ci-${{ github.sha }}
      POKERATTACK_FIXTURE_SOURCE: ${{ github.sha }}
      POKERATTACK_FIXTURE_EPHEMERAL_TLS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Record tools and install isolated runtime
        run: |
          dotnet --info
          node --version
          python --version
          docker version
          dotnet workload install wasm-tools --skip-manifest-update
          python -m pip install -r deploy/release/requirements-validation.txt
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
          npm ci --prefix tests
          cd tests
          npx playwright install --with-deps chromium
      - name: Configure disposable runner image store before building or testing
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 deploy/release/ci_docker_store.py
      - name: Test business logic and API hosting with disposable PostgreSQL
        run: |
          dotnet test src/Server/ChefKnifeStudios.PokerAttack.Server.BL.Tests -c Release
          dotnet build src/Server/ChefKnifeStudios.PokerAttack.Server.WebAPI -c Release
          dotnet test src/Server/ChefKnifeStudios.PokerAttack.Server.WebAPI.Tests -c Release
      - name: Test target guards, preparation, release boundaries and host recovery
        run: |
          npm --prefix tests run test:guards
          node --test deploy/prepare-client-artifact.test.mjs deploy/prepare-production-client.test.mjs
          node --test tests/release/*.test.cjs
          python -m unittest discover -s deploy/release -p 'test_*.py' -v
          docker run --rm -v "$PWD:/work:ro" -w /work/deploy/linode python:3.13-bookworm python -m unittest discover -p 'test_*.py' -v
      - name: Validate shared Docker collector, units, additive Alloy and dashboard queries
        run: python deploy/monitoring/check-monitoring.py
      - name: Publish isolated browser fixture without releasing a client
        run: dotnet publish src/Client/ChefKnifeStudios.PokerAttack.Client.WebApp -c Release -o artifacts/client-wp04 /p:BlazorEnableCompression=false
      - name: Build exact candidate images once
        run: |
          docker build --platform linux/amd64 --build-arg "SOURCE_REVISION=$GITHUB_SHA" -f src/Server/ChefKnifeStudios.PokerAttack.Server.WebAPI/Dockerfile -t "$POKERATTACK_FIXTURE_IMAGE" .
          docker build --platform linux/amd64 --build-arg "SOURCE_REVISION=$GITHUB_SHA" -f src/Server/ChefKnifeStudios.PokerAttack.Server.Data/Dockerfile -t "$POKERATTACK_FIXTURE_MIGRATION_IMAGE" .
      - name: Verify exact API image, read-only maintenance and retained browser smoke
        run: python deploy/linode/check-local-containers.py
      - name: Verify HTTPS gameplay, private isolation, cleanup and revocation
        run: |
          python deploy/linode/check-release-gameplay.py
          docker run --rm -v "$PWD:/work:ro" -w /work/deploy/linode python:3.13-bookworm python check-generated-evidence.py /work/artifacts/D02-gameplay-result.json
          python deploy/linode/check-release-gameplay.py --client-only
      - name: Save tested images without rebuilding
        run: python deploy/release/server_images.py capture artifacts/server-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: image-upload
        with:
          name: tested-server-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/server-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-server-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/D02-gameplay-result.json
            artifacts/E04-client-browser-result.json
          if-no-files-found: error
          retention-days: 30

  validation:
    name: Server validation
    needs: [changes, isolated]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report stable required check
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          ISOLATED_RESULT: ${{ needs.isolated.result }}
          SERVER_CHANGED: ${{ needs.changes.outputs.server }}
        run: |
          test "$CHANGE_RESULT" = success
          if [ "$SERVER_CHANGED" = true ]; then
            test "$ISOLATED_RESULT" = success
          fi

  publish:
    needs: [changes, isolated, validation]
    if: >-
      needs.validation.result == 'success' &&
      inputs.operation != 'rollback' &&
      github.repository == 'henryfaulkner/ChefKnifeStudios.PokerAttack' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.production_eligible == 'true' &&
      needs.changes.outputs.server == 'true' &&
      vars.DEPLOYMENT_AUTOMATION_ENABLED == 'true'
    environment: server-acr
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      published_artifact_id: ${{ steps.published.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r deploy/release/requirements-validation.txt
      - name: Configure disposable publication runner for the exact saved image identities
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 deploy/release/ci_docker_store.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.isolated.outputs.image_artifact_id }}
          path: artifacts/server-images
          merge-multiple: true
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish only exact tested images and capture verified registry digests
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_AUTOMATION_ENABLED: ${{ vars.DEPLOYMENT_AUTOMATION_ENABLED }}
        run: python deploy/release/server_images.py publish artifacts/server-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: published
        with:
          name: published-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/server-images/published-images.json
          if-no-files-found: error
          retention-days: 30

  resolve:
    needs: [changes, validation, publish]
    if: >-
      always() && needs.validation.result == 'success' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback')) &&
      github.repository == 'henryfaulkner/ChefKnifeStudios.PokerAttack' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOYMENT_AUTOMATION_ENABLED == 'true'
    environment: server-status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packet_artifact_id: ${{ steps.packet.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r deploy/release/requirements-validation.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.operation != 'rollback'
        with:
          artifact-ids: ${{ needs.publish.outputs.published_artifact_id }}
          path: artifacts/published-images
          merge-multiple: true
      - name: Resolve exact release and recovery packet before reset review
        env:
          DEPLOYMENT_AUTOMATION_ENABLED: ${{ vars.DEPLOYMENT_AUTOMATION_ENABLED }}
          APPROVED_CONFIG_SHA256: ${{ vars.APPROVED_CONFIG_SHA256 }}
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/server_manifest.py artifacts/published-images/published-images.json artifacts/server-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: packet
        with:
          name: server-release-packet-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/server-release/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [changes, validation, resolve]
    if: >-
      needs.validation.result == 'success' &&
      github.repository == 'henryfaulkner/ChefKnifeStudios.PokerAttack' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.production_eligible == 'true' &&
      needs.changes.outputs.server == 'true' &&
      vars.DEPLOYMENT_AUTOMATION_ENABLED == 'true'
    environment: server-linode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r deploy/release/requirements-validation.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.packet_artifact_id }}
          path: artifacts/server-release
          merge-multiple: true
      - name: Validate exact reset decision, drain and deliver only the captured digest
        id: deliver
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_AUTOMATION_ENABLED: ${{ vars.DEPLOYMENT_AUTOMATION_ENABLED }}
          APPROVED_CONFIG_SHA256: ${{ vars.APPROVED_CONFIG_SHA256 }}
          RELEASE_DRAIN_SECONDS: ${{ vars.RELEASE_DRAIN_SECONDS || '300' }}
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_DEPLOY_PRIVATE_KEY: ${{ secrets.LINODE_DEPLOY_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/server_deliver.py artifacts/server-release/release-packet.json artifacts/delivery-outcome.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.deliver.outcome != 'skipped'
        with:
          name: delivery-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/delivery-outcome.json
          if-no-files-found: warn
          retention-days: 30

  verify:
    needs: [changes, validation, resolve, deploy]
    if: >-
      always() && needs.resolve.result == 'success' && needs.validation.result == 'success' &&
      (needs.deploy.result == 'success' || github.run_attempt > 1) &&
      github.repository == 'henryfaulkner/ChefKnifeStudios.PokerAttack' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOYMENT_AUTOMATION_ENABLED == 'true'
    environment: server-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      proof_artifact_id: ${{ steps.proof.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install browser runtime before issuing short-lived admission
        run: |
          python -m pip install -r deploy/release/requirements-validation.txt
          npm ci --prefix tests
          cd tests
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.packet_artifact_id }}
          path: artifacts/server-release
          merge-multiple: true
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify gameplay and import exact generated proof without promotion
        env:
          DEPLOYMENT_AUTOMATION_ENABLED: ${{ vars.DEPLOYMENT_AUTOMATION_ENABLED }}
          CLIENT_ARCHIVE_ACCOUNT: ${{ vars.CLIENT_ARCHIVE_ACCOUNT }}
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_EVIDENCE_PRIVATE_KEY: ${{ secrets.LINODE_EVIDENCE_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/server_verify.py artifacts/server-release/server-manifest.json artifacts/server-verification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: proof
        with:
          name: server-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/server-verification/evidence.json
            artifacts/server-verification/promotion-review.json
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: [resolve, verify]
    if: >-
      needs.verify.result == 'success' &&
      github.repository == 'henryfaulkner/ChefKnifeStudios.PokerAttack' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOYMENT_AUTOMATION_ENABLED == 'true'
    environment: server-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r deploy/release/requirements-validation.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Prepare public browser runtime before checking evidence freshness
        run: |
          npm ci --prefix tests
          cd tests
          npx playwright install --with-deps chromium
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.packet_artifact_id }}
          path: artifacts/server-release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.proof_artifact_id }}
          path: artifacts/server-verification
          merge-multiple: true
      - name: Revalidate fresh evidence and exact explicit promotion decision
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_AUTOMATION_ENABLED: ${{ vars.DEPLOYMENT_AUTOMATION_ENABLED }}
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_PROMOTION_PRIVATE_KEY: ${{ secrets.LINODE_PROMOTION_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/server_promote.py artifacts/server-release/server-manifest.json artifacts/server-verification/evidence.json artifacts/server-verification/promotion-review.json artifacts/promotion-outcome.json
      - name: Finish only the promoted release and verify normal public browser admission
        env:
          DEPLOYMENT_AUTOMATION_ENABLED: ${{ vars.DEPLOYMENT_AUTOMATION_ENABLED }}
          CLIENT_ARCHIVE_ACCOUNT: ${{ vars.CLIENT_ARCHIVE_ACCOUNT }}
          GRAFANA_DOCKER_DASHBOARD_URL: ${{ vars.GRAFANA_DOCKER_DASHBOARD_URL }}
          LINODE_STATUS_PRIVATE_KEY: ${{ secrets.LINODE_STATUS_PRIVATE_KEY }}
          LINODE_PROMOTION_PRIVATE_KEY: ${{ secrets.LINODE_PROMOTION_PRIVATE_KEY }}
          LINODE_KNOWN_HOSTS: ${{ vars.LINODE_KNOWN_HOSTS }}
        run: python deploy/release/server_finish.py artifacts/server-release/server-manifest.json artifacts/promotion-outcome.json artifacts/server-completion.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/promotion-outcome.json
            artifacts/server-completion.json
          if-no-files-found: warn
          retention-days: 30
