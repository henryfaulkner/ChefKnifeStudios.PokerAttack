name: $(SourceBranchName)-chefknifestudios-pokerattack-server-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
    - main
    - fix-data-docker

pool:
  vmImage: ubuntu-latest

variables:
  azure-subscription-service-connection: PokerAttackSC
  container-registry: chefknife.azurecr.io
  container-tag: $(Build.BuildNumber)
  container-registry-service-connection: AzureContainerRegistrySC
  api-container-name: chefknifestudios.pokerattack.server.webapi
  api-container: $(container-registry)/$(api-container-name):$(container-tag)
  migration-container-name: chefknifestudios.pokerattack.server.data
  migration-container: $(container-registry)/$(migration-container-name):$(container-tag)

stages:
- stage: BuildAndPublish
  displayName: Build and Publish ChefKnifeStudios.PokerAttack.Server
  jobs:
  - job: BuildAndPublish
    displayName: Build and Publish ChefKnifeStudios.PokerAttack.Server.WebAPI

    variables:
      buildConfiguration: 'Release'

    steps:
    - checkout: self
      persistCredentials: true # Required for git tagging 

    - task: Docker@2
      inputs:
        containerRegistry: '$(container-registry-service-connection)'
        command: 'login'

    - script: |
        docker compose build
      displayName: Docker compose build
      env:
        CONTAINER_REGISTRY: $(container-registry)
        CONTAINER_TAG: $(container-tag)

    - script: |
        docker push $(api-container)
        docker push $(migration-container)
      displayName: Docker push images

- stage: DeployProd
  displayName: Deploy Production
  jobs: 
  - deployment: DeployProd
    displayName: Deploy ChefKnifeStudios.PokerAttack.Server.WebAPI to Prod
    environment: 'Prod'
    variables:
    - group: 'Prod-PokerAttack'
    strategy:
      runOnce:   
        deploy:
          steps:
          - checkout: self
            persistCredentials: true # Required for git tagging  

          - task: Docker@2
            inputs:
              containerRegistry: '$(container-registry-service-connection)'
              command: 'login'

          # DB Migration
          - script: |
              docker run --rm -e CONNECTIONSTRINGS__POKERATTACKDB $(migration-container)
            displayName: 'Run DB Migrations'
            env:
              CONNECTIONSTRINGS__POKERATTACKDB: $(ConnectionStrings-PokerAttackDB)

          # Deploy API Container App
          - task: AzureContainerApps@1
            displayName: "Deploy API Container App"
            inputs:
              azureSubscription: '$(azure-subscription-service-connection)'
              imageToDeploy: '$(api-container)'
              containerAppName: poker-attack-api
              resourceGroup: 'poker-attack-rg'
              containerAppEnvironment: 'poker-attack-api-env'

- stage: E2ETestProduction
  displayName: E2E Tests - Production
  dependsOn: DeployProd
  jobs:
  - job: RunE2ETests
    displayName: Run Playwright E2E Tests
    pool:
      vmImage: 'ubuntu-latest'
    variables:
    - group: 'Prod-PokerAttack'
    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js 20'

    - script: |
        cd tests
        npm ci
      displayName: 'Install npm dependencies'

    - script: |
        cd tests
        npx playwright install chromium --with-deps
      displayName: 'Install Playwright browsers'

    - script: |
        cd tests
        npm test
      displayName: 'Run E2E Tests Against Production'
      continueOnError: true  # Don't fail deployment if tests fail
      env:
        CLIENT_URL: $(TestClientUrl)
        API_URL_CLEANUP: $(TestApiUrl)
        CI: true

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'tests/test-results/junit.xml'
        testRunTitle: 'E2E Tests - Production Deploy $(Build.BuildNumber)'
        failTaskOnFailedTests: false  # Just log, don't fail

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Test Reports'
      condition: always()
      inputs:
        targetPath: 'tests/playwright-report'
        artifact: 'e2e-test-report-$(Build.BuildNumber)'
