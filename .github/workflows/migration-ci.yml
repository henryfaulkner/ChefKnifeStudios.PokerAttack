# Manual build-only reference; routine client/server workflows own required checks and delivery.
name: Bootstrap build-only reference
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: pokerattack-bootstrap-build
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.detect.outputs.server }}
      production_eligible: ${{ steps.detect.outputs.production_eligible }}
      client: ${{ steps.detect.outputs.client }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: detect
      run: python3 deploy/release/changes.py
  isolated:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image_artifact_id: ${{ steps.image-upload.outputs.artifact-id }}
    env:
      POKERATTACK_FIXTURE_IMAGE: pokerattack-api:ci-${{ github.sha }}
      POKERATTACK_FIXTURE_MIGRATION_IMAGE: pokerattack-migrations:ci-${{ github.sha
        }}
      POKERATTACK_FIXTURE_SOURCE: ${{ github.sha }}
      POKERATTACK_FIXTURE_EPHEMERAL_TLS: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 10.0.401
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tests/package-lock.json
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Record tools and install isolated runtime
      run: 'dotnet --info

        node --version

        python --version

        docker version

        dotnet workload install wasm-tools --skip-manifest-update

        python -m pip install -r deploy/release/requirements-validation.txt

        sudo apt-get update

        sudo apt-get install --yes libnss3-tools

        npm ci --prefix tests

        cd tests

        npx playwright install --with-deps chromium

        '
    - name: Configure disposable runner image store before building or testing
      run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 deploy/release/ci_docker_store.py
    - name: Test business logic and API hosting with disposable PostgreSQL
      run: 'dotnet test src/Server/ChefKnifeStudios.PokerAttack.Server.BL.Tests -c
        Release

        dotnet build src/Server/ChefKnifeStudios.PokerAttack.Server.WebAPI -c Release

        dotnet test src/Server/ChefKnifeStudios.PokerAttack.Server.WebAPI.Tests -c
        Release

        '
    - name: Test target guards, preparation, release boundaries and host recovery
      run: 'npm --prefix tests run test:guards

        node --test deploy/prepare-client-artifact.test.mjs deploy/prepare-production-client.test.mjs

        node --test tests/release/*.test.cjs

        python -m unittest discover -s deploy/release -p ''test_*.py'' -v

        docker run --rm -v "$PWD:/work:ro" -w /work/deploy/linode python:3.13-bookworm
        python -m unittest discover -p ''test_*.py'' -v

        '
    - name: Validate shared Docker collector, units, additive Alloy and dashboard
        queries
      run: python deploy/monitoring/check-monitoring.py
    - name: Publish isolated browser fixture without releasing a client
      run: dotnet publish src/Client/ChefKnifeStudios.PokerAttack.Client.WebApp -c
        Release -o artifacts/client-wp04 /p:BlazorEnableCompression=false
    - name: Build exact candidate images once
      run: 'docker build --platform linux/amd64 --build-arg "SOURCE_REVISION=$GITHUB_SHA"
        -f src/Server/ChefKnifeStudios.PokerAttack.Server.WebAPI/Dockerfile -t "$POKERATTACK_FIXTURE_IMAGE"
        .

        docker build --platform linux/amd64 --build-arg "SOURCE_REVISION=$GITHUB_SHA"
        -f src/Server/ChefKnifeStudios.PokerAttack.Server.Data/Dockerfile -t "$POKERATTACK_FIXTURE_MIGRATION_IMAGE"
        .

        '
    - name: Verify exact API image, read-only maintenance and retained browser smoke
      run: python deploy/linode/check-local-containers.py
    - name: Verify HTTPS gameplay, private isolation, cleanup and revocation
      run: 'python deploy/linode/check-release-gameplay.py

        docker run --rm -v "$PWD:/work:ro" -w /work/deploy/linode python:3.13-bookworm
        python check-generated-evidence.py /work/artifacts/D02-gameplay-result.json

        python deploy/linode/check-release-gameplay.py --client-only

        '
    - name: Save tested images without rebuilding
      run: python deploy/release/server_images.py capture artifacts/server-images
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      id: image-upload
      with:
        name: tested-server-images-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/server-images/
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: isolated-server-checks-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'artifacts/D02-gameplay-result.json

          artifacts/E04-client-browser-result.json

          '
        if-no-files-found: error
        retention-days: 30
  checks:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tests/package-lock.json
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Validate production preparation and release boundaries
      run: 'node --test deploy/prepare-production-client.test.mjs deploy/prepare-client-artifact.test.mjs

        node --test tests/release/*.test.cjs

        python -m pip install -r deploy/release/requirements-validation.txt

        python -m unittest discover -s deploy/release -p ''test_*.py'' -v

        npm ci --prefix tests

        npm --prefix tests run test:guards

        '
  package:
    needs:
    - changes
    - checks
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_artifact_id: ${{ steps.manifest-upload.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 10.0.401
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Record tools and install WASM workload
      run: 'dotnet --info

        node --version

        python --version

        dotnet workload install wasm-tools --skip-manifest-update

        dotnet workload list

        python -m pip install -r deploy/release/requirements-validation.txt

        '
    - name: Publish and prepare once
      run: 'dotnet publish src/Client/ChefKnifeStudios.PokerAttack.Client.WebApp -c
        Release -o artifacts/client-publish /p:BlazorEnableCompression=false

        node deploy/prepare-production-client.mjs artifacts/client-publish/wwwroot
        artifacts/client-production

        python deploy/release/client_artifacts.py pack artifacts/client-production
        artifacts/client.tar.gz artifacts/client-candidate.json "$GITHUB_SHA" "$GITHUB_RUN_ID"
        "$GITHUB_RUN_ATTEMPT"

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      id: upload
      with:
        name: client-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'artifacts/client.tar.gz

          artifacts/client-candidate.json

          '
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Bind the actual Actions artifact ID and verify exact archive
      env:
        CLIENT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
      run: 'python deploy/release/client_artifacts.py finalize artifacts/client-candidate.json
        "$CLIENT_ARTIFACT_ID" artifacts/client-manifest.json

        python deploy/release/client_artifacts.py check artifacts/client.tar.gz artifacts/client-manifest.json

        python deploy/release/client_artifacts.py summary artifacts/client-manifest.json
        artifacts/client-identity.json

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      id: manifest-upload
      with:
        name: client-manifest-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'artifacts/client-manifest.json

          artifacts/client-identity.json

          '
        if-no-files-found: error
        retention-days: 30
  server_validation:
    name: Bootstrap server validation
    needs:
    - changes
    - isolated
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Report stable required check
      env:
        CHANGE_RESULT: ${{ needs.changes.result }}
        ISOLATED_RESULT: ${{ needs.isolated.result }}
        SERVER_CHANGED: ${{ needs.changes.outputs.server }}
      run: "test \"$CHANGE_RESULT\" = success\nif [ \"$SERVER_CHANGED\" = true ];\
        \ then\n  test \"$ISOLATED_RESULT\" = success\nfi\n"
  client_validation:
    name: Bootstrap client validation
    needs:
    - changes
    - checks
    - package
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Report stable required check
      env:
        CHANGE_RESULT: ${{ needs.changes.result }}
        CHECK_RESULT: ${{ needs.checks.result }}
        PACKAGE_RESULT: ${{ needs.package.result }}
        CLIENT_CHANGED: ${{ needs.changes.outputs.client }}
        RESTORE: 'false'
      run: "test \"$CHANGE_RESULT\" = success\ntest \"$CHECK_RESULT\" = success\n\
        if [ \"$CLIENT_CHANGED\" = true ] && [ \"$RESTORE\" != true ]; then\n  test\
        \ \"$PACKAGE_RESULT\" = success\nfi\n"
