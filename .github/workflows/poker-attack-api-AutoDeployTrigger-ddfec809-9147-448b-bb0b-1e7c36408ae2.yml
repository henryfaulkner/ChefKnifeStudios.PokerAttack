name: Trigger auto deployment for poker-attack-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/poker-attack-api-AutoDeployTrigger-ddfec809-9147-448b-bb0b-1e7c36408ae2.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POKERATTACKAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.POKERATTACKAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.POKERATTACKAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: chefknife.azurecr.io
          registryUsername: ${{ secrets.POKERATTACKAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.POKERATTACKAPI_REGISTRY_PASSWORD }}
          containerAppName: poker-attack-api
          resourceGroup: poker-attack-rg
          imageToBuild: chefknife.azurecr.io/poker-attack-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


